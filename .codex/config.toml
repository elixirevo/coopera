# --- coopera hooks (managed) ---
# Keep this block last in the file; init regenerates it.
[[hooks.SessionStart]]
[[hooks.SessionStart.hooks]]
type = "command"
command = 'c="${COOPERA_BIN:-coopera}"; command -v "$c" >/dev/null 2>&1 && COOPERA_TOOL=codex COOPERA_SESSION_FALLBACK="ppid-$PPID" "$c" hook session-start || echo {}'

[[hooks.UserPromptSubmit]]
[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = 'c="${COOPERA_BIN:-coopera}"; command -v "$c" >/dev/null 2>&1 && COOPERA_TOOL=codex COOPERA_SESSION_FALLBACK="ppid-$PPID" "$c" hook user-prompt-submit || echo {}'

[[hooks.SessionEnd]]
[[hooks.SessionEnd.hooks]]
type = "command"
command = 'c="${COOPERA_BIN:-coopera}"; command -v "$c" >/dev/null 2>&1 && COOPERA_TOOL=codex COOPERA_SESSION_FALLBACK="ppid-$PPID" "$c" hook session-end || echo {}'
