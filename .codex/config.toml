[[hooks.SessionStart]]
[[hooks.SessionStart.hooks]]
type = "command"
command = 'c="/Users/elixir/dev/project/elixirevo/coopera/target/release/coopera"; [ -x "$c" ] || c="$(command -v coopera)"; [ -x "$c" ] && COOPERA_TOOL=codex "$c" hook session-start || echo {}'

