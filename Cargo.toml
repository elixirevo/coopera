[workspace]
resolver = "2"
members = ["crates/coopera-core", "crates/coopera-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
regex = "1"
jiff = "0.2"
tempfile = "3"
