name: ci
# PR verification only — pushes to main are tested by the release workflow.
on:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        if: runner.os != 'Windows'
        run: cargo fmt --check
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace
